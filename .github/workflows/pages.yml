name: Publish public site
on:
  push:
    branches:
      - main
  workflow_dispatch:
# Least privilege: jobs get read-only contents unless they declare more below.
permissions:
  contents: read
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # npm ci runs third-party install scripts here, so this job never gets a write token.
    permissions:
      contents: read
      pages: read
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            backend/package-lock.json
      - run: npm ci
      - run: npm --prefix backend ci
      - run: npm run check
      - run: npm run test:integration
      - name: assert-dist-hashed
        run: |
          grep -q 'data-song-title=' dist/index.html
          grep -E 'nknk-gallery-ui\.js\?v=[a-f0-9]{12}' dist/index.html
          ! grep -q 'nknk-gallery-ui.js?v=20260930' dist/index.html
          ! grep -q 'nknk-gallery-ui.js?v=20261005nknk' dist/index.html
          ! grep -Eq 'connect-src[^"]*(localhost|127\.0\.0\.1)' dist/index.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist
      - uses: actions/upload-artifact@v4
        with:
          name: public-site-dist
          path: dist
          retention-days: 3
  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
  # Mirror hashed dist/ onto gh-pages so Settings → Pages can use Branch: gh-pages
  # when GitHub Actions is not selected as the Pages source (which currently serves repo root).
  publish-gh-pages-branch:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v4
        with:
          name: public-site-dist
          path: _site
      - name: verify-mirrored-dist
        run: |
          test -f _site/index.html
          grep -q 'data-song-title=' _site/index.html
          grep -E 'nknk-gallery-ui\.js\?v=[a-f0-9]{12}' _site/index.html
          touch _site/.nojekyll
      - uses: peaceiris/actions-gh-pages@84c30a85c19949d7eee79c4ff27748b70285e453 # v4.1.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./_site
          force_orphan: true
          enable_jekyll: false
