name: Publish public site
on:
  push:
    branches:
      - main
  workflow_dispatch:
# Least privilege: jobs get read-only contents unless they declare more below.
permissions:
  contents: read
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # npm ci runs third-party install scripts here, so this job never gets a write token.
    permissions:
      contents: read
      pages: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            backend/package-lock.json
      - run: npm ci
      - run: npm --prefix backend ci
      - run: npm run check
      - run: npm run test:integration
      - name: assert-dist-hashed
        run: |
          grep -q 'data-song-title=' dist/index.html
          grep -E 'nknk-gallery-ui\.js\?v=[a-f0-9]{12}' dist/index.html
          ! grep -q 'nknk-gallery-ui.js?v=20260930' dist/index.html
          ! grep -q 'nknk-gallery-ui.js?v=20261005nknk' dist/index.html
          ! grep -Eq 'connect-src[^"]*(localhost|127\.0\.0\.1)' dist/index.html
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: dist
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: public-site-dist
          path: dist
          retention-days: 3
  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
  # Mirror hashed dist/ onto gh-pages so Settings → Pages can use Branch: gh-pages
  # when GitHub Actions is not selected as the Pages source (which currently serves repo root).
  publish-gh-pages-branch:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: public-site-dist
          path: _site
      - name: verify-mirrored-dist
        run: |
          test -f _site/index.html
          grep -q 'data-song-title=' _site/index.html
          grep -E 'nknk-gallery-ui\.js\?v=[a-f0-9]{12}' _site/index.html
          touch _site/.nojekyll
      - uses: peaceiris/actions-gh-pages@84c30a85c19949d7eee79c4ff27748b70285e453 # v4.1.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./_site
          force_orphan: true
          enable_jekyll: false
