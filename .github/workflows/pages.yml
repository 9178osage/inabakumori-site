name: Publish public site
on:
  push:
    branches:
      - main
  workflow_dispatch:
# Least privilege: jobs get read-only contents unless they declare more below.
permissions:
  contents: read
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    # This job runs repository and dependency code (install scripts stay disabled by .npmrc),
    # so it never gets a write token.
    permissions:
      contents: read
      pages: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.22.1
          cache: npm
          cache-dependency-path: |
            package-lock.json
            backend/package-lock.json
      - run: npm ci
      - run: npm --prefix backend ci
      - run: npm run check
      - run: npm run test:integration
      - name: assert-dist-hashed
        run: |
          grep -q 'data-song-title=' dist/index.html
          grep -E 'nknk-gallery-ui\.js\?v=[a-f0-9]{12}' dist/index.html
          ! grep -q 'nknk-gallery-ui.js?v=20260930' dist/index.html
          ! grep -q 'nknk-gallery-ui.js?v=20261005nknk' dist/index.html
          ! grep -Eiq 'Content-Security-Policy" content="[^"]*(localhost|127\.[0-9]|\[::1\]|0\.0\.0\.0)' dist/index.html
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: public-site-dist
          path: dist
          retention-days: 3
  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
  # Mirror hashed dist/ onto gh-pages so Settings → Pages can use Branch: gh-pages
  # when GitHub Actions is not selected as the Pages source (which currently serves repo root).
  publish-gh-pages-branch:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: public-site-dist
          path: _site
      - name: verify-mirrored-dist
        run: |
          test -f _site/index.html
          grep -q 'data-song-title=' _site/index.html
          grep -E 'nknk-gallery-ui\.js\?v=[a-f0-9]{12}' _site/index.html
          touch _site/.nojekyll
      - uses: peaceiris/actions-gh-pages@84c30a85c19949d7eee79c4ff27748b70285e453 # v4.1.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./_site
          force_orphan: true
          enable_jekyll: false
