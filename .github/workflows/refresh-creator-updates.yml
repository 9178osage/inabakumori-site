name: Refresh creator updates
on:
  schedule:
    - cron: "17 11 * * *" # Daily at 11:17 UTC (04:17 PDT / 03:17 PST).
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: refresh-creator-updates
  cancel-in-progress: false
jobs:
  refresh:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
    outputs:
      source-outcome: ${{ steps.sources.outcome }}
      snapshot: ${{ steps.snapshot.outputs.hash }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.22.1
          cache: npm
          cache-dependency-path: |
            package-lock.json
            backend/package-lock.json
      - run: npm ci
      - run: npm --prefix backend ci
      - name: Record the previous completed main push
        run: node tools/record-current-deployment.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Read public creator sources
        id: sources
        # Publish the explicit failure status while keeping the previous entries.
        # The final report job fails only when a source has had no successful check for over 48 hours;
        # shorter outages are reported as ::warning:: annotations by the script.
        continue-on-error: true
        run: node tools/refresh-creator-updates.mjs
      - run: npm test
      - run: npm run check
      - run: npm run test:integration
      - run: npm run check:changelog
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Identify checked snapshot
        id: snapshot
        run: echo "hash=$(sha256sum data/creator-updates.json | cut -d ' ' -f 1)" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: creator-updates-snapshot
          path: |
            data/creator-updates.json
            docs/CHANGELOG.md
          if-no-files-found: error
          retention-days: 3
  commit:
    needs: refresh
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    outputs:
      changed: ${{ steps.commit.outputs.changed }}
      sha: ${{ steps.commit.outputs.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: creator-updates-snapshot
          path: checked-snapshot
      - name: Commit checked snapshot
        id: commit
        run: |
          cp checked-snapshot/data/creator-updates.json data/creator-updates.json
          cp checked-snapshot/docs/CHANGELOG.md docs/CHANGELOG.md
          if git diff --quiet -- data/creator-updates.json docs/CHANGELOG.md; then
            echo "No snapshot changes."
            exit 0
          fi
          # Refuse to overwrite work pushed while the read-only refresh job ran.
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          # The snapshot came from a job that ran dependency code. Without running any code from it,
          # accept only a canonical creator snapshot with official links and this commit's record row.
          fail() { echo "::error::$1"; exit 1; }
          CHANGELOG_STAT=$(git diff --numstat -- docs/CHANGELOG.md | cut -f1,2)
          if [ -n "$CHANGELOG_STAT" ]; then
            [ "$CHANGELOG_STAT" = "$(printf '1\t0')" ] || fail "Checked CHANGELOG may only add one deployment record row."
            CHANGELOG_DIFF=$(git diff -U0 -- docs/CHANGELOG.md)
            printf "%s\n" "$CHANGELOG_DIFF" | grep -Eq "^\+\| [0-9]{2}-[0-9]{2} \| \`${GITHUB_SHA:0:7}\` \| 补记前次发布，供定时动态同步前核对 \| [0-9]+ / [0-9]+ \|$" \
              || fail "Checked CHANGELOG row is not this commit's deployment record."
          fi
          [ "$(wc -c < data/creator-updates.json)" -le 262144 ] || fail "Checked creator snapshot is too large."
          jq --indent 2 . data/creator-updates.json | cmp -s - data/creator-updates.json \
            || fail "Checked creator snapshot is not canonical JSON."
          jq -e --argjson old "$(git show HEAD:data/creator-updates.json)" '
            def ts: type == "string" and test("^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}\\.[0-9]{3}Z$");
            def owner: {youtube: "inabakumori", pixiv: "nknk", campfire: "nknk"};
            def link($source; $id):
              if $source == "youtube" then "https://www.youtube.com/watch?v=\($id)"
              elif $source == "pixiv" then "https://www.pixiv.net/artworks/\($id)"
              else "https://camp-fire.jp/projects/970332/view/activities/\($id)" end;
            (keys == ["items", "sources", "version"]) and .version == 1
            and ([.sources[] | {id, creator, label, url}] == [$old.sources[] | {id, creator, label, url}])
            and all(.sources[];
              (keys - ["checkedAt", "creator", "id", "label", "lastAttemptAt", "message", "status", "url"]) == []
              and (.status == "error" or (.status == "ok" and .checkedAt != null))
              and (.checkedAt == null or (.checkedAt | ts)) and (.lastAttemptAt == null or (.lastAttemptAt | ts))
              and (.message == null or .message == "Official source could not be checked. Previous entries are retained."))
            and (.items | type == "array")
            and ([.items[].id] | length == (unique | length))
            and ([.items[].source] | (map(select(. == "youtube")) | length) <= 12
              and (map(select(. == "pixiv")) | length) <= 12 and (map(select(. == "campfire")) | length) <= 5)
            and all(.items[]; . as $item
              | ($item.id | if type == "string" then ltrimstr(($item.source | tostring) + ":") else "" end) as $id
              | (keys - ["creator", "datePrecision", "id", "publishedAt", "source", "title", "url"]) == []
              and ($item.source | type == "string") and owner[$item.source] != null and $item.creator == owner[$item.source]
              and ($item.id | type == "string") and $item.id == "\($item.source):\($id)"
              and ($id | test(if $item.source == "youtube" then "^[A-Za-z0-9_-]{11}$" else "^[1-9][0-9]{0,14}$" end))
              and $item.url == link($item.source; $id)
              and ($item.publishedAt | ts) and ($item.datePrecision == null or $item.datePrecision == "day")
              and ($item.title | type == "string" and length <= 2000 and test("\\S")
                and (test("[\\x{0}-\\x{8}\\x{b}-\\x{1f}\\x{7f}-\\x{9f}\\x{202a}-\\x{202e}\\x{2066}-\\x{2069}]") | not)))' \
            data/creator-updates.json >/dev/null || fail "Checked creator snapshot has an unexpected shape, source or link."
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/creator-updates.json docs/CHANGELOG.md
          git commit -m "chore: refresh public creator updates"
          git push origin HEAD:refs/heads/main
          echo "changed=true" >> "$GITHUB_OUTPUT"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
  publish:
    needs: [refresh, commit]
    if: needs.commit.outputs.changed == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      actions: write
    steps:
      - name: Verify and publish updated snapshot
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          UPDATE_SHA: ${{ needs.commit.outputs.sha }}
          SNAPSHOT_HASH: ${{ needs.refresh.outputs.snapshot }}
        # Token-created commits do not trigger push workflows automatically.
        run: |
          gh workflow run check.yml --ref main
          gh workflow run pages.yml --ref main
          for attempt in $(seq 1 12); do
            gh api --method GET "repos/$GH_REPO/actions/runs" -f head_sha="$UPDATE_SHA" -f event=workflow_dispatch -f per_page=30 > /tmp/creator-update-runs.json
            VERIFY_RUN=$(jq -r '.workflow_runs | map(select(.name == "Verify website")) | max_by(.id) | .id // empty' /tmp/creator-update-runs.json)
            PUBLISH_RUN=$(jq -r '.workflow_runs | map(select(.name == "Publish public site")) | max_by(.id) | .id // empty' /tmp/creator-update-runs.json)
            if [ -n "$VERIFY_RUN" ] && [ -n "$PUBLISH_RUN" ]; then break; fi
            sleep 10
          done
          test -n "$VERIFY_RUN" && test -n "$PUBLISH_RUN"
          gh run watch "$VERIFY_RUN" --exit-status --interval 15
          gh run watch "$PUBLISH_RUN" --exit-status --interval 15
          for attempt in $(seq 1 12); do
            if curl --fail --silent --show-error --max-time 20 "https://osagechan.top/updates.html?check=$UPDATE_SHA" -o /tmp/published-creator-updates.html && grep -q "name=\"creator-updates-version\" content=\"$SNAPSHOT_HASH\"" /tmp/published-creator-updates.html; then
              echo "Verified published creator snapshot $UPDATE_SHA"
              exit 0
            fi
            sleep 10
          done
          echo "::error::Published page does not contain the checked creator snapshot."
          exit 1
  report:
    needs: [refresh, commit, publish]
    if: always() && needs.refresh.outputs.source-outcome == 'failure'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions: {}
    steps:
      - run: |
          echo "::error::An official source has not been read successfully for over 48 hours. Previous entries were retained; see source status on the updates page."
          exit 1
