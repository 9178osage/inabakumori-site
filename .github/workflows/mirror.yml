name: Mirror to GitLab

on:
  push:
  delete:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gitlab-mirror
  cancel-in-progress: false

jobs:
  mirror:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Push branches and tags to GitLab
        env:
          GITLAB_TOKEN: ${{ secrets.GITLAB_TOKEN }}
          GH_TOKEN: ${{ github.token }}
          GIT_TERMINAL_PROMPT: "0"
        run: |
          set -euo pipefail
          if [ -z "${GH_TOKEN}" ]; then
            echo "::error::GH_TOKEN is not set."
            exit 1
          fi
          if [ -z "${GITLAB_TOKEN}" ]; then
            echo "::error::GITLAB_TOKEN is not set."
            exit 1
          fi
          REPO_NAME="${GITHUB_REPOSITORY#*/}"
          # Git Smart HTTP on GitHub and GitLab requires HTTP Basic auth, not Bearer.
          # Pass extraheader via GIT_CONFIG_* environment variables so tokens never
          # appear in remote URLs, repo.git/config, or process argv.
          GH_AUTH=$(printf 'x-access-token:%s' "${GH_TOKEN}" | base64 | tr -d '\r\n')
          GITLAB_AUTH=$(printf 'oauth2:%s' "${GITLAB_TOKEN}" | base64 | tr -d '\r\n')
          echo "::add-mask::${GH_AUTH}"
          echo "::add-mask::${GITLAB_AUTH}"
          GIT_CONFIG_COUNT=1 \
          GIT_CONFIG_KEY_0="http.https://github.com/.extraheader" \
          GIT_CONFIG_VALUE_0="Authorization: Basic ${GH_AUTH}" \
            git clone --bare "https://github.com/${GITHUB_REPOSITORY}.git" repo.git
          cd repo.git
          GIT_CONFIG_COUNT=1 \
          GIT_CONFIG_KEY_0="http.https://gitlab.com/.extraheader" \
          GIT_CONFIG_VALUE_0="Authorization: Basic ${GITLAB_AUTH}" \
            git push --prune "https://gitlab.com/personal-projects7420146/${REPO_NAME}.git" \
            '+refs/heads/*:refs/heads/*' '+refs/tags/*:refs/tags/*'
