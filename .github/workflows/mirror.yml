name: Mirror to GitLab

on:
  push:
  delete:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gitlab-mirror
  cancel-in-progress: false

jobs:
  mirror:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Push branches and tags to GitLab
        env:
          GITLAB_TOKEN: ${{ secrets.GITLAB_TOKEN }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [ -z "${GITLAB_TOKEN}" ]; then
            echo "::error::GITLAB_TOKEN is not set."
            exit 1
          fi
          REPO_NAME="${GITHUB_REPOSITORY#*/}"
          # Tokens stay in git http extra headers, not in the remote URL or process argv path (audit P2-12).
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: bearer ${GH_TOKEN}" \
            clone --bare "https://github.com/${GITHUB_REPOSITORY}.git" repo.git
          cd repo.git
          git -c "http.https://gitlab.com/.extraheader=AUTHORIZATION: Bearer ${GITLAB_TOKEN}" \
            push --prune "https://gitlab.com/personal-projects7420146/${REPO_NAME}.git" \
            '+refs/heads/*:refs/heads/*' '+refs/tags/*:refs/tags/*'
