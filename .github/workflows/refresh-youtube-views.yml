# Weekly refresh of YouTube viewCount / viewsCheckedAt in js/songs.js.
# Requires repository secret YOUTUBE_API_KEY (YouTube Data API v3). Do not put the key in the repo.
# Local equivalent:
#   YOUTUBE_API_KEY=... node tools/refresh-youtube-views.mjs
#
# GITHUB_TOKEN with contents:write can commit to the default branch. Commits made with
# GITHUB_TOKEN do not re-trigger push workflows; publish dispatches Pages explicitly.
# If your org blocks token pushes to main, switch the commit step to open a PR instead
# (see comments below).
name: Refresh YouTube view counts
on:
  schedule:
    # Mondays 15:00 UTC ≈ Monday 08:00 PT
    - cron: "0 15 * * 1"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: refresh-youtube-views
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Only this job can push; it runs repository code but installs no dependencies.
    permissions:
      contents: write
    outputs:
      changed: ${{ steps.commit.outputs.changed }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # full history so the pull --rebase before push can replay the commit
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: Require YouTube API key secret
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: |
          if [ -z "$YOUTUBE_API_KEY" ]; then
            echo "::error::Missing repository secret YOUTUBE_API_KEY. Add it under Settings → Secrets and variables → Actions. Do not commit the key."
            exit 1
          fi
      - name: Refresh view counts
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: node tools/refresh-youtube-views.mjs
      - name: Commit updates when counts changed
        id: commit
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          if git diff --quiet -- js/songs.js; then
            echo "No view-count changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          case "$REF_NAME" in
            ""|-*|*..*|*[!A-Za-z0-9._/-]*)
              echo "::error::Refusing to push to unexpected ref name"
              exit 1 ;;
          esac
          git add js/songs.js
          git commit -m "chore: refresh YouTube view counts"
          # main may have moved while the job ran; replay this commit on top instead of a non-fast-forward failure.
          git pull --rebase origin "$REF_NAME"
          git push origin "HEAD:refs/heads/$REF_NAME"
          echo "changed=true" >> "$GITHUB_OUTPUT"
          # If push to main is blocked for GITHUB_TOKEN, replace the push with a PR flow:
          #   git checkout -b chore/youtube-views-$(date -u +%Y%m%d)
          #   git push -u origin HEAD
          #   gh pr create --title "chore: refresh YouTube view counts" --body "Automated weekly refresh via tools/refresh-youtube-views.mjs."
          # and add permissions: pull-requests: write
  publish:
    needs: refresh
    if: github.ref == 'refs/heads/main' && needs.refresh.outputs.changed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # Only this job may dispatch workflows; it runs no repository or dependency code.
    permissions:
      contents: read
      actions: write
    steps:
      - name: Publish updated view counts
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: gh workflow run pages.yml --ref main
