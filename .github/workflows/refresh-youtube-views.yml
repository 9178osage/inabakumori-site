# Weekly refresh of YouTube viewCount / viewsCheckedAt in js/songs.js.
# Requires repository secret YOUTUBE_API_KEY (YouTube Data API v3). Do not put the key in the repo.
# Local equivalent:
#   YOUTUBE_API_KEY=... node tools/refresh-youtube-views.mjs
#
# Refresh and all checks run with read-only permissions. Only a separate job may
# commit the checked files; token-created commits require explicit Verify/Publish.
name: Refresh YouTube view counts
on:
  schedule:
    # Mondays 15:00 UTC ≈ Monday 08:00 PT
    - cron: "0 15 * * 1"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: refresh-youtube-views
  cancel-in-progress: false
jobs:
  refresh:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
    outputs:
      snapshot: ${{ steps.snapshot.outputs.hash }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.22.1
          cache: npm
          cache-dependency-path: |
            package-lock.json
            backend/package-lock.json
      - run: npm ci
      - run: npm --prefix backend ci
      - name: Require YouTube API key secret
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: |
          if [ -z "$YOUTUBE_API_KEY" ]; then
            echo "::error::Missing repository secret YOUTUBE_API_KEY. Add it under Settings → Secrets and variables → Actions. Do not commit the key."
            exit 1
          fi
      - name: Record the previous completed main push
        run: node tools/record-current-deployment.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Refresh view counts
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: node tools/refresh-youtube-views.mjs
      - run: npm test
      - run: npm run check
      - run: npm run test:integration
      - run: npm run check:changelog
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Identify checked published counts
        id: snapshot
        run: echo "hash=$(sha256sum dist/js/songs.js | cut -d ' ' -f 1)" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: youtube-views-snapshot
          path: |
            js/songs.js
            docs/CHANGELOG.md
          if-no-files-found: error
          retention-days: 3
  commit:
    needs: refresh
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    # This job runs no repository or dependency code with its write token.
    permissions:
      contents: write
    outputs:
      changed: ${{ steps.commit.outputs.changed }}
      sha: ${{ steps.commit.outputs.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: youtube-views-snapshot
          path: checked-snapshot
      - name: Commit checked view counts
        id: commit
        run: |
          # A moved main must be checked again, never merged with an older checked snapshot.
          if [ "$(git rev-parse HEAD)" != "$GITHUB_SHA" ]; then
            echo "::error::main changed during validation; rerun this workflow on the latest main."
            exit 1
          fi
          cp checked-snapshot/js/songs.js js/songs.js
          cp checked-snapshot/docs/CHANGELOG.md docs/CHANGELOG.md
          if git diff --quiet -- js/songs.js docs/CHANGELOG.md; then
            echo "No view-count changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add js/songs.js docs/CHANGELOG.md
          git commit -m "chore: refresh YouTube view counts"
          # A concurrent push after checkout is rejected by the normal fast-forward check.
          git push origin HEAD:refs/heads/main
          echo "changed=true" >> "$GITHUB_OUTPUT"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
  publish:
    needs: [refresh, commit]
    if: needs.commit.outputs.changed == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    # Only this job may dispatch workflows; it runs no repository or dependency code.
    permissions:
      contents: read
      actions: write
    steps:
      - name: Verify and publish updated view counts
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          UPDATE_SHA: ${{ needs.commit.outputs.sha }}
          SNAPSHOT_HASH: ${{ needs.refresh.outputs.snapshot }}
        run: |
          gh workflow run check.yml --ref main
          gh workflow run pages.yml --ref main
          for attempt in $(seq 1 12); do
            gh api --method GET "repos/$GH_REPO/actions/runs" -f head_sha="$UPDATE_SHA" -f event=workflow_dispatch -f per_page=30 > /tmp/youtube-update-runs.json
            VERIFY_RUN=$(jq -r '.workflow_runs | map(select(.name == "Verify website")) | max_by(.id) | .id // empty' /tmp/youtube-update-runs.json)
            PUBLISH_RUN=$(jq -r '.workflow_runs | map(select(.name == "Publish public site")) | max_by(.id) | .id // empty' /tmp/youtube-update-runs.json)
            if [ -n "$VERIFY_RUN" ] && [ -n "$PUBLISH_RUN" ]; then break; fi
            sleep 10
          done
          test -n "$VERIFY_RUN" && test -n "$PUBLISH_RUN"
          gh run watch "$VERIFY_RUN" --exit-status --interval 15
          gh run watch "$PUBLISH_RUN" --exit-status --interval 15
          for attempt in $(seq 1 12); do
            if curl --fail --silent --show-error --max-time 20 "https://osagechan.top/js/songs.js?check=$UPDATE_SHA" -o /tmp/published-youtube-songs.js && [ "$(sha256sum /tmp/published-youtube-songs.js | cut -d ' ' -f 1)" = "$SNAPSHOT_HASH" ]; then
              echo "Verified published YouTube view counts $UPDATE_SHA"
              exit 0
            fi
            sleep 10
          done
          echo "::error::Published songs do not match the checked view counts."
          exit 1
