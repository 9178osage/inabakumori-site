name: Verify website
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # Deployment coverage uses the checkout's complete ancestry.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            backend/package-lock.json
      - run: npm ci
      - run: npm --prefix backend ci
      - name: Check deployment record table against GitHub Actions
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: npm run check:changelog
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - run: npm run check
      - name: Committed js/auth.js matches tools/auth-src.js
        run: git diff --exit-code -- js/auth.js
      - run: npm run test:integration
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: public-site
          path: dist/
          retention-days: 7
